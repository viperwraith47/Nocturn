name: Create Release

on:
  push:
    branches: [main]

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Check if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.2 --json tagName 2>/dev/null; then
            echo "Release v1.0.2 already exists, skipping"
            exit 0
          fi
          echo "Release does not exist, creating..."

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.2 \
            --title "v1.0.2" \
            --notes "Nocturn v1.0.2 - Dark Mode Enforcer for legacy websites lacking native dark mode. Auto-applies a clean customizable dark theme with per-site whitelist/blacklist, adjustable brightness/contrast/sepia/grayscale/hue rotation, media toggle, keyboard shortcuts, MutationObserver for dynamic content, and lightweight vanilla TypeScript."
